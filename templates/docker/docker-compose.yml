services:
  api:
    build: .
    ports:
      - "{{PORT}}:{{PORT}}"
    env_file: .env
    environment:
      NODE_ENV: production
      # @if db
      MONGO_URI: mongodb://mongo:27017/{{PROJECT_NAME}}
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
      # @endif
